[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "irradiance"
version = "0.0.4"
description = "Crash-proof, GIL-free camera RAW (DNG) decoding for NumPy and PyTorch data loaders"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["numpy"]
keywords = ["raw", "dng", "camera", "bayer", "demosaic", "pytorch", "dataloader", "numpy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Repository = "https://github.com/jysf/pyirradiance"
Issues = "https://github.com/jysf/pyirradiance/issues"
"Upstream (Rust)" = "https://github.com/jysf/irradiance"

[tool.maturin]
module-name = "irradiance"
features = ["extension-module"]
