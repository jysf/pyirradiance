[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pyirradiance"
version = "0.0.1"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["numpy"]

[tool.maturin]
module-name = "irradiance"
features = ["extension-module"]
