[package]
name = "pyirradiance"
version = "0.0.3"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "irradiance_py"
crate-type = ["cdylib"]

# Standalone workspace: the prototype must not alter the parent crate's build.
[workspace]

[dependencies]
irradiance = { path = "../../crustimg_redo_plus/irradiance" }
pyo3 = { version = "0.23", features = ["abi3-py39"] }
numpy = "0.23"

[features]
# Enabled by maturin (pyproject.toml), off for `cargo test`: extension-module
# leaves libpython unlinked, which breaks linking the test binary on Linux.
extension-module = ["pyo3/extension-module"]
