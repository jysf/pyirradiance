[package]
name = "pyirradiance"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "irradiance_py"
crate-type = ["cdylib"]

# Standalone workspace: the prototype must not alter the parent crate's build.
[workspace]

[dependencies]
irradiance = { path = "../../crustimg_redo_plus/irradiance" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
numpy = "0.23"
