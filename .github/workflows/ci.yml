name: CI

on:
  push:
  pull_request:
  # Weekly canary against upstream's latest main, so upstream changes (fixes
  # we can adopt, or breakage) show up within a week instead of at the next
  # deliberate pin bump.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "irradiance ref to test against (empty = the pinned commit)"
        required: false
        default: ""

jobs:
  test:
    # The golden step is the cross-arch determinism check (tests/golden.json
    # was generated on macOS arm64): x86_64 + arm64 Linux, arm64 macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Empty = the pinned commit in .github/irradiance-pin.
      IRRADIANCE_REF: ${{ github.event_name == 'schedule' && 'main' || inputs.upstream_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out irradiance where Cargo.toml's path dep expects it
        run: |
          dest="$GITHUB_WORKSPACE/../../crustimg_redo_plus/irradiance"
          git clone --quiet https://github.com/jysf/irradiance.git "$dest"
          git -C "$dest" checkout --quiet --detach "${IRRADIANCE_REF:-$(cat .github/irradiance-pin)}"
          echo "irradiance at $(git -C "$dest" log --oneline -1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q maturin numpy
          if [ "$RUNNER_OS" = Linux ]; then
            # CPU wheel: the default Linux torch wheel pulls in CUDA (~GBs).
            .venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          else
            .venv/bin/pip install -q torch
          fi

      - name: Lint, build, test (synthetic DNGs)
        run: tests/ci.sh "$RUNNER_TEMP/synth"
